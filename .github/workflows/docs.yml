name: Publish docs and web demo

on:
  push:
    branches: [ main ]
    paths:
      - 'kblobs/**'
      - 'samples/web/**'
      - 'gradle/**'
      - 'kotlin-js-store/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dokka HTML and the web demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate API docs
        run: ./gradlew :kblobs:dokkaGeneratePublicationHtml --no-daemon

      - name: Build web demo
        run: ./gradlew :samples:web:wasmJsBrowserDistribution --no-daemon

      # One Pages site: API docs at the root, the interactive explainer under /demo/.
      - name: Assemble site
        run: |
          mkdir -p kblobs/build/dokka/html/demo
          cp -R samples/web/build/dist/wasmJs/productionExecutable/. kblobs/build/dokka/html/demo/
          rm -f kblobs/build/dokka/html/demo/*.map

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kblobs/build/dokka/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
